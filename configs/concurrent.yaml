# Same as default.yaml but drives the load through a ThreadPoolExecutor.
# Used for the sequential vs concurrent comparison in the final report.
providers:
  - name: primary
    fail_rate: 0.25
    base_latency_ms: 180
    cost_per_1k_tokens: 0.01
  - name: backup
    fail_rate: 0.05
    base_latency_ms: 260
    cost_per_1k_tokens: 0.006
circuit_breaker:
  failure_threshold: 3
  reset_timeout_seconds: 2
  success_threshold: 1
cache:
  enabled: true
  backend: redis           # "memory" (default) or "redis" (requires docker compose up -d)
  ttl_seconds: 300
  similarity_threshold: 0.92
  redis_url: "redis://localhost:6379/0"
load_test:
  requests: 100
  # 10 request dong thoi tren cung 1 gateway/cache/breaker.
  concurrency: 10

# Reproducibility: one RNG stream per scenario, seeded from this value.
# Two consecutive `make run-chaos` runs produce identical decision metrics
# (availability, cache_hit_rate, circuit_open_count, cost). Latency figures
# still vary slightly because they are measured on the wall clock.
# Flush Redis before each measured run: redis-cli FLUSHDB.
seed: 42

# Chaos scenarios: each overrides provider fail_rate for targeted testing.
scenarios:
  - name: primary_timeout_100
    description: "Primary provider fails 100% — all traffic should fallback"
    provider_overrides:
      primary: 1.0
  - name: primary_flaky_50
    description: "Primary provider fails 50% — circuit should oscillate"
    provider_overrides:
      primary: 0.5
  - name: all_healthy
    description: "Baseline — both providers healthy"
    provider_overrides: {}
